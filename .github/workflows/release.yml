name: Release

on: workflow_dispatch

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Calculate calendar version
        uses: StephaneBour/actions-calver@v1.6
        id: calver
        with:
          date_format: '%Y.%-m.%-d'
          release: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release notes
        env:
          RELEASE: ${{ steps.calver.outputs.release }}
        run: uv run --extra=release towncrier build --draft --version "$RELEASE" >
          release-notes.md
      - name: Update changelog
        env:
          RELEASE: ${{ steps.calver.outputs.release }}
        run: uv run --extra=release towncrier build --yes --version "$RELEASE"
      - name: Open changelog pull request
        id: changelog_pr
        env:
          RELEASE: ${{ steps.calver.outputs.release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          branch="release-changelog-${RELEASE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add CHANGELOG.rst newsfragments
          git commit -m "Bump CHANGELOG for ${RELEASE}"
          git push -u origin "$branch" --force
          if pr_url="$(gh pr view "$branch" --json url -q .url 2>/dev/null)"; then
            true
          else
            pr_url="$(gh pr create --base main --head "$branch" \
              --title "Bump CHANGELOG for ${RELEASE}" \
              --body "Automated changelog update for release \`${RELEASE}\`. Publish runs after the GitHub Release is created.")"
          fi
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          gh pr merge --squash --auto "$pr_url" || true
      - name: Wait for changelog merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.changelog_pr.outputs.pr_url }}
        run: |
          set -eux
          for _ in $(seq 1 90); do
            state="$(gh pr view "$PR_URL" --json state -q .state)"
            if [ "$state" = "MERGED" ]; then
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "Changelog PR was closed without merging" >&2
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for changelog PR to merge (may need an admin merge)." >&2
          exit 1
      - name: Create GitHub Release
        env:
          RELEASE: ${{ steps.calver.outputs.release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git fetch origin main
          commit="$(git rev-parse origin/main)"
          gh release create "$RELEASE" \
            --target "$commit" \
            --title "$RELEASE" \
            --notes-file release-notes.md \
            --latest
