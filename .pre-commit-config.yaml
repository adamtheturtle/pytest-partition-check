---
fail_fast: true

.uv_version: &uv_version uv==0.11.7

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-json
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: file-contents-sorter
        files: spelling_private_dict\.txt$
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
      - id: rst-backticks
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: uv run --extra=dev actionlint
        language: python
        pass_filenames: false
        types_or: [yaml]
        additional_dependencies: [*uv_version]
      - id: pydocstringformatter
        name: pydocstringformatter
        entry: uv run --extra=dev pydocstringformatter
        language: python
        types_or: [python]
        additional_dependencies: [*uv_version]
      - id: mypy
        name: mypy
        entry: uv run --extra=dev -m mypy --num-workers=4
        language: python
        pass_filenames: false
        types_or: [python, toml]
        stages: [pre-push]
        additional_dependencies: [*uv_version]
      - id: check-manifest
        name: check-manifest
        entry: uv run --extra=dev -m check_manifest
        language: python
        pass_filenames: false
        stages: [pre-push]
        additional_dependencies: [*uv_version]
      - id: pyright
        name: pyright
        entry: uv run --extra=dev -m pyright .
        language: python
        pass_filenames: false
        stages: [pre-push]
        additional_dependencies: [*uv_version]
      - id: pyright-verifytypes
        name: pyright-verifytypes
        entry: uv run --extra=dev -m pyright --verifytypes pytest_partition_check
        language: python
        pass_filenames: false
        stages: [pre-push]
        additional_dependencies: [*uv_version]
      - id: pyrefly
        name: pyrefly
        entry: uv run --extra=dev pyrefly check
        language: python
        pass_filenames: false
        stages: [pre-push]
        additional_dependencies: [*uv_version]
      - id: ty
        name: ty
        entry: uv run --extra=dev ty check
        language: python
        pass_filenames: false
        stages: [pre-push]
        additional_dependencies: [*uv_version]
      - id: vulture
        name: vulture
        entry: uv run --extra=dev -m vulture .
        language: python
        pass_filenames: false
        types_or: [python]
        additional_dependencies: [*uv_version]
      - id: pyroma
        name: pyroma
        entry: uv run --extra=dev -m pyroma --min 10 .
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
      - id: deptry
        name: deptry
        entry: uv run --extra=dev -m deptry src/
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
      - id: pylint
        name: pylint
        entry: uv run --extra=dev -m pylint src/ tests/
        language: python
        pass_filenames: false
        stages: [manual]
        additional_dependencies: [*uv_version]
      - id: ruff-check-fix
        name: Ruff check fix
        entry: uv run --extra=dev -m ruff check --fix
        language: python
        types_or: [python]
        additional_dependencies: [*uv_version]
      - id: ruff-format-fix
        name: Ruff format
        entry: uv run --extra=dev -m ruff format
        language: python
        types_or: [python]
        additional_dependencies: [*uv_version]
      - id: strict-kwargs-fix
        name: strict-kwargs
        entry: uv run --extra=dev strict-kwargs check --fix
        language: python
        types_or: [python]
        require_serial: true
        additional_dependencies: [*uv_version]
      - id: no-defaults
        name: no-defaults
        entry: uv run --extra=dev no-defaults
        language: python
        types_or: [python]
        require_serial: true
        additional_dependencies: [*uv_version]
      - id: vale-sync
        name: vale sync
        entry: uv run --extra=dev vale sync
        language: python
        pass_filenames: false
        files: (\.(rst|md)$|^\.vale\.ini$)
        additional_dependencies: [*uv_version]
      - id: vale
        name: vale
        entry: uv run --extra=dev vale
        language: python
        types_or: [rst, markdown]
        require_serial: true
        additional_dependencies: [*uv_version]
      - id: doc8
        name: doc8
        entry: uv run --extra=dev -m doc8
        language: python
        types_or: [rst]
        additional_dependencies: [*uv_version]
      - id: interrogate
        name: interrogate
        entry: uv run --extra=dev -m interrogate
        language: python
        types_or: [python]
      - id: pyproject-fmt-fix
        name: pyproject-fmt
        entry: uv run --extra=dev pyproject-fmt
        language: python
        files: pyproject.toml
      - id: yamlfix
        name: yamlfix
        entry: uv run --extra=dev yamlfix
        language: python
        types_or: [yaml]
        additional_dependencies: [*uv_version]
      - id: zizmor
        name: zizmor
        entry: uv run --extra=dev zizmor --strict-collection .github
        language: python
        pass_filenames: false
        types_or: [yaml]
        additional_dependencies: [*uv_version]
      - id: sphinx-lint
        name: sphinx-lint
        entry: uv run --extra=dev sphinx-lint --enable=all --disable=line-too-long
        language: python
        types_or: [rst]
        additional_dependencies: [*uv_version]
